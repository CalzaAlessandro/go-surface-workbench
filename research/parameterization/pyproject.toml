[project]
name = "go-parameterization-research"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "rdkit>=2024.3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "parmed>=4.3.1",
    "pytest>=8",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
