[project]
name = "go-builder"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "netcdf4>=1.7.5.1.post1",
    "numpy>=2.4.6",
    "parmed>=4.3.1",
    "rdkit>=2026.9.1",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
