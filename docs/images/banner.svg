<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="350" viewBox="0 0 1600 350" role="img">
      <title>GO Workbench</title><desc>Chalk blueprint of graphene fragments, oxygen groups and an amine-terminated PEG chain assembling into a functionalized GO sheet. Schematic software-model assembly.</desc>
