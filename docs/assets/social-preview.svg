<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img">
      <title>GO Workbench</title><desc>Chalk blueprint of a graphene oxide sheet with hydroxyl, epoxide and edge carboxyl groups. Schematic model construction drawing.</desc>
      <defs>
  <linearGradient id="blue" x2="1" y2="1"><stop stop-color="#133f70"/><stop offset="1" stop-color="#082a50"/></linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0 H0 V24" fill="none" stroke="#b8dcf3" stroke-opacity=".095" stroke-width=".6"/></pattern>
  <pattern id="major" width="120" height="120" patternUnits="userSpaceOnUse"><path d="M120 0 H0 V120" fill="none" stroke="#b8dcf3" stroke-opacity=".08" stroke-width="1"/></pattern>
  <filter id="chalk" x="-8%" y="-8%" width="116%" height="116%">
    <feTurbulence type="fractalNoise" baseFrequency=".45" numOctaves="3" seed="13" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
</defs><style>text {font-family: "SFMono-Regular", Menlo, "DejaVu Sans Mono", monospace}</style>
